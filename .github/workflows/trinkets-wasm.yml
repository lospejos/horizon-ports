name: trinkets-wasm

# Push a tag like `trinkets-wasm-v0.5.0` to build trinkets.hmod (WebAssembly) and attach it to a release.
on:
  push:
    tags: ["trinkets-wasm-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # The SDK build pinned in trinkets/Cargo.toml ([package.metadata.horizon] sdk).
  SDK_REV: 2b77287de099c9316278ba7ac4d83590fdb7ef30

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            trinkets/target
            trinkets/.horizon
          key: trinkets-wasm-${{ env.SDK_REV }}-${{ hashFiles('trinkets/Cargo.lock') }}
          restore-keys: trinkets-wasm-${{ env.SDK_REV }}-
      - name: Install rustup toolchain (the tool then installs the pinned one itself)
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-horizon-mod from the SDK commit
        run: cargo install --locked --git https://github.com/horizon-rust/horizon --rev "$SDK_REV" cargo-horizon-mod
      - name: Build
        working-directory: trinkets
        run: cargo horizon-mod build --wasm
      - uses: actions/upload-artifact@v7
        with:
          name: trinkets-hmod
          path: trinkets/target/horizon-mod/trinkets.hmod
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" trinkets/target/horizon-mod/trinkets.hmod --title "$GITHUB_REF_NAME" --notes "Trinkets, WebAssembly build: no worn-totem save and no death drop."
