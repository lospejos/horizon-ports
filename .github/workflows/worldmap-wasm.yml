name: worldmap-wasm

# Push a tag like `worldmap-wasm-v0.1.0` to build worldmap.hmod (WebAssembly) and attach it to a release.
on:
  push:
    tags: ["worldmap-wasm-v*"]
    # A push to the branch builds the .hmod as an artifact (no release): the compile check.
    branches: ["worldmap-wasm"]
    paths: ["worldmap/**", ".github/workflows/worldmap-wasm.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # The SDK build pinned in worldmap/Cargo.toml ([package.metadata.horizon] sdk).
  SDK_REV: 2b77287de099c9316278ba7ac4d83590fdb7ef30

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            worldmap/target
            worldmap/.horizon
          key: worldmap-wasm-${{ env.SDK_REV }}-${{ hashFiles('worldmap/Cargo.lock') }}
          restore-keys: worldmap-wasm-${{ env.SDK_REV }}-
      - name: Install rustup toolchain (the tool then installs the pinned one itself)
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-horizon-mod from the SDK commit
        run: command -v cargo-horizon-mod || cargo install --locked --git https://github.com/horizon-rust/horizon --rev "$SDK_REV" cargo-horizon-mod
      - name: Build
        working-directory: worldmap
        run: cargo horizon-mod build --wasm
      - name: Unit tests
        working-directory: worldmap
        run: cargo test
      - uses: actions/upload-artifact@v7
        with:
          name: worldmap-hmod
          path: worldmap/target/horizon-mod/worldmap.hmod
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" worldmap/target/horizon-mod/worldmap.hmod --title "$GITHUB_REF_NAME" --notes "Worldmap, WebAssembly build."
