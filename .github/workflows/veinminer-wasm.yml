name: veinminer-wasm

# Push a tag like `veinminer-wasm-v0.1.0` to build veinminer.hmod (WebAssembly) and attach it to a release.
on:
  push:
    tags: ["veinminer-wasm-v*"]
    # A push to the branch builds the .hmod as an artifact (no release): the compile check.
    branches: ["veinminer-wasm"]
    paths: ["veinminer/**", ".github/workflows/veinminer-wasm.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # The SDK build pinned in veinminer/Cargo.toml ([package.metadata.horizon] sdk).
  SDK_REV: 2b77287de099c9316278ba7ac4d83590fdb7ef30

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            veinminer/target
            veinminer/.horizon
          key: veinminer-wasm-${{ env.SDK_REV }}-${{ hashFiles('veinminer/Cargo.lock') }}
          restore-keys: veinminer-wasm-${{ env.SDK_REV }}-
      - name: Install rustup toolchain (the tool then installs the pinned one itself)
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-horizon-mod from the SDK commit
        run: cargo install --locked --git https://github.com/horizon-rust/horizon --rev "$SDK_REV" cargo-horizon-mod
      - name: Build
        working-directory: veinminer
        run: cargo horizon-mod build --wasm
      - uses: actions/upload-artifact@v7
        with:
          name: veinminer-hmod
          path: veinminer/target/horizon-mod/veinminer.hmod
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" veinminer/target/horizon-mod/veinminer.hmod --title "$GITHUB_REF_NAME" --notes "Veinminer, WebAssembly build."
