# trinkets: Trinkets 3.7.2 (Emi, MIT), the player's extra equipment slots for the Homestead mods that
# declare them (the slot table is src/data.rs, written by tools/trinkets_port.py).
# One package holds the code and the content: data/ and assets/ are the content mod mods/trinkets
# (the empty-slot pictures, `trinkets:slot_*`), copied here because a content package can't use
# the id of a compiled mod.
# - src/lib.rs (mod_api::Hooks): the menu (G key -> `trinkets:open` payload -> server menu,
#   menu_clicked / menu_closed), right-click wear (right_click_item), the tooltip (item_tooltip).
# - WebAssembly build: no mixins, so no worn-totem save and no death drop (the worn trinkets are kept
#   through death, `copy_on_death`).
id = "trinkets"
name = "Trinkets"
version = "0.5.1"
description = "The player's extra equipment slots (Trinkets 3.7.2 by Emi, MIT)"
authors = []
api = "0.2"
side = "both"
capabilities = ["registries"]
